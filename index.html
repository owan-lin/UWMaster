<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#32006e"><title>UWMaster · Owan 的课程面板</title><link rel="stylesheet" href="assets/fonts.css"><link rel="stylesheet" href="style.css"></head>
<body>
<a class="skip-link" href="#app">跳至课程面板</a>
<header class="masthead"><div class="masthead-inner"><a class="uw-brand" href="https://www.washington.edu/" target="_blank" rel="noopener noreferrer" aria-label="University of Washington 官网"><img src="assets/uw-logo.svg" alt="University of Washington" width="444" height="80"></a><div class="personal-mark"><span class="owner-avatar">O</span><span>Owan</span></div></div></header>
<nav class="utility-bar" aria-label="页面导航"><div class="utility-inner"><a class="app-brand" href="/">UW<span>Master</span></a><div class="page-tabs"><a href="/" aria-current="page">我的学期</a><a href="/retrieval.html">课程检索</a></div></div></nav>
<section class="campus-hero" aria-labelledby="page-title"><div class="hero-inner"><h1 id="page-title">Course <span>watch.</span></h1><div class="term-line"><span id="termName">正在读取学期…</span><span>SEATTLE · PACIFIC TIME</span></div></div><span class="photo-caption">UNIVERSITY OF WASHINGTON · SEATTLE CAMPUS</span></section>
<main id="app" tabindex="-1"><div class="loading" role="status">正在读取本地快照…</div></main>
<footer class="site-footer"><span>UWMaster <span class="footer-divider">/</span> Owan 的学习空间</span><span>个人项目 · 本地保存 <span class="footer-divider">/</span> 校园素材：University of Washington</span></footer>
<input id="fileInput" type="file" accept="application/json,.json" hidden>
<dialog id="detail" aria-label="任务详情"><article></article><form method="dialog"><button>关闭</button></form></dialog>
<dialog id="addTask" aria-labelledby="addTaskTitle"><article><button class="dialog-close" aria-label="关闭添加任务">×</button><h2 id="addTaskTitle">添加任务</h2><form id="addTaskForm"><label for="taskTitle">标题</label><input id="taskTitle" name="title" maxlength="160" required placeholder="例如：HW1"><div class="task-form-pair"><div><label for="taskCourse">课程</label><select id="taskCourse" name="course_id" required></select></div><div><label for="taskKind">分类</label><select id="taskKind" name="kind"><option value="homework">作业</option><option value="preparation">课前材料</option><option value="participation">参与</option><option value="class">到课</option><option value="project">项目</option><option value="quiz">测验</option><option value="exam">考试</option><option value="extra_credit">额外加分</option></select></div></div><label for="taskDate">日期与时间</label><div class="task-form-pair"><input id="taskDate" type="date" aria-label="任务日期"><input id="taskTime" type="time" aria-label="任务时间"></div><label for="taskDescription">任务详情</label><textarea id="taskDescription" rows="4" maxlength="12000" placeholder="具体要求、准备内容…"></textarea><label for="taskSource">来源链接</label><input id="taskSource" type="url" placeholder="https://…"><p id="addTaskStatus" role="status" aria-live="polite"></p><div class="task-dialog-actions"><button type="button" id="cancelAddTask">取消</button><button type="submit" id="submitAddTask" class="gold">添加任务</button></div></form></article></dialog>
<dialog id="history" aria-labelledby="history-title"><h2 id="history-title">变更历史</h2><div class="dialog-content"></div><form method="dialog"><button>关闭</button></form></dialog>
<link rel="stylesheet" href="retrieval_assistant.css"><script src="app.js"></script><script src="retrieval_assistant.js"></script></body></html>
